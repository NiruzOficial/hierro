<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bitácora de Hierro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone app shell — compact header, one column of content, tab bar docked at the bottom for the thumb,
   rest timer docked just above it on the training tab */
:root{
  --bg:#eef1f4; --surface:#ffffff; --line:#d3d9e1; --fg:#151b24; --muted:#5d6878;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#dfe8f7;
  --good:#1d7a4a; --good-soft:#dcefe4; --warn:#b5560f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141a; --surface:#181e27; --line:#2a3340; --fg:#e7ecf2; --muted:#94a0b1;
  --accent:#6f9ef0; --accent-ink:#0b1220; --accent-soft:#1c2a42; --good:#57c08a; --good-soft:#173326; --warn:#f0a35e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141a; --surface:#181e27; --line:#2a3340; --fg:#e7ecf2; --muted:#94a0b1;
  --accent:#6f9ef0; --accent-ink:#0b1220; --accent-soft:#1c2a42; --good:#57c08a; --good-soft:#173326; --warn:#f0a35e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(var(--navh) + 90px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
h1 span{color:var(--accent)}
.status{font-size:.78rem;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:1.45rem;text-transform:uppercase;margin:0 0 2px;line-height:1.1;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 10px;font-size:.93rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* bottom tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:var(--navh)}
nav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  font:600 .72rem var(--body);letter-spacing:.02em;min-width:0}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--accent)}
nav button[aria-current="true"] svg{stroke-width:2.4}

/* hero card for the training day */
.today{background:var(--fg);color:var(--bg);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.today .q{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.2;opacity:.85;margin-bottom:10px;text-wrap:balance}
.today h2{font-size:1.7rem}
.today .meta{display:flex;justify-content:space-between;font-size:.85rem;opacity:.8;margin-top:8px}
.today .bar{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px}

/* exercise cards */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;width:100%;background:none;border:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.ex-name{font-weight:600;font-size:1.02rem;min-width:0}
.ex-mus{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.scheme{font-family:var(--display);font-size:1.1rem;color:var(--accent);white-space:nowrap}
.ex.done{border-color:var(--good)}
.ex.done .ex-top{background:var(--good-soft)}
.ex.done .scheme{color:var(--good)}
.ex-body{padding:0 14px 12px}
.last{font-size:.82rem;color:var(--muted);margin:0 0 8px}
.pr{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.sets{display:grid;grid-template-columns:2.2em 1fr 1fr;gap:6px 8px;align-items:center}
.sets .h{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.setn{font-family:var(--display);color:var(--muted);font-size:1.05rem}
input,select,textarea{font:500 1rem var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.link{background:none;border:none;color:var(--accent);font:600 .9rem var(--body);cursor:pointer;padding:4px 0}
.link.quiet{color:var(--muted)}
.ex-foot{display:flex;justify-content:space-between;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:6px;padding:10px 14px;font:600 .95rem var(--body);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.big{width:100%;padding:16px;font-size:1.05rem;border-radius:10px}
.btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row>label{flex:1 1 100px;display:flex;flex-direction:column;gap:4px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:.85rem;color:var(--muted);font-weight:600}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.empty{color:var(--muted);font-size:.92rem;padding:16px 4px;text-align:center}
.bar{height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.over>i{background:var(--good)}
.today .bar>i{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.now td{background:var(--accent-soft)}
.vol{display:grid;grid-template-columns:6.5em 1fr 2.5em;gap:6px 10px;align-items:center;font-size:.9rem}
.vol .bar{margin:0}
.day{display:grid;grid-template-columns:3.2em 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:none}
.dname{font-family:var(--display);font-weight:700;font-size:1.3rem;text-transform:uppercase;line-height:1}
.day ul{margin:4px 0 0;padding-left:18px;font-size:.92rem}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.err{color:var(--warn)}

/* food */
.macros{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-top:8px}
.photo{width:100%;max-height:240px;object-fit:cover;border-radius:8px;display:block}
.meal{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.meal .n{min-width:0;overflow-wrap:anywhere}
.meal .k{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ai-items{display:grid;grid-template-columns:1fr 4.2em 4.2em 2em;gap:6px;align-items:center;margin-top:10px}
.ai-items .h{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ai-items input{padding:6px 7px;font-size:.95rem}
.ai-items input[type=number]{font-size:1rem}
.note{font-size:.85rem;color:var(--muted);margin-top:8px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.95rem;padding:10px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:p 1s infinite alternate}
@keyframes p{from{opacity:.3}to{opacity:1}}

/* rest timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:7;background:var(--fg);color:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.timer-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.timer .t{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:2.8em;line-height:1}
.timer .lab{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;opacity:.7;display:block}
.timer button{background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:6px;padding:6px 8px;font:600 .9rem var(--display);cursor:pointer;opacity:.9}
.timer button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.timer .sp{flex:1}
.timer.done .t{color:var(--good)}
.goal{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:6px;padding:8px 10px;margin:0 0 10px}
.goal b{font-family:var(--display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.goal .why{font-size:.8rem;color:var(--muted);display:block}
.goal.up{background:var(--good-soft)}
details.swap{margin-top:6px}
details.swap summary{cursor:pointer;color:var(--muted);font:600 .85rem var(--body);padding:4px 0}
details.swap select{margin-top:6px}
textarea{font:400 .95rem var(--body);resize:vertical;min-height:70px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.cal .c{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;font-family:var(--display);font-size:1rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .c.t{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .c.now{outline:2px solid var(--fg);outline-offset:-2px}
.cal .c i{width:5px;height:5px;border-radius:50%;background:var(--good);margin-top:2px}
.cal .c.t i{background:var(--accent-ink)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.imc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scale{position:relative;height:10px;border-radius:5px;margin:10px 0 4px;background:linear-gradient(90deg,var(--accent-soft) 0 15%,var(--good-soft) 15% 45%,color-mix(in srgb,var(--warn) 30%,transparent) 45% 70%,color-mix(in srgb,var(--warn) 60%,transparent) 70%)}
.scale b{position:absolute;top:-4px;width:4px;height:18px;background:var(--fg);border-radius:2px}
.scale-l{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.demo-row{display:flex;gap:12px;align-items:center;margin:0 0 10px;background:var(--bg);border-radius:8px;padding:6px 10px 6px 4px}
.demo{width:118px;height:auto;flex:none;max-width:40%}
.demo-info{min-width:0;display:flex;flex-direction:column;gap:2px}
.works{font-weight:600;font-size:.95rem;line-height:1.3}
.demo-info .link{text-align:left;text-decoration:none;font-size:.85rem}
.doses{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dose{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:8px 10px;font:600 .9rem var(--display);cursor:pointer;min-width:3.6em}
.dose[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:.95rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a.wait{color:var(--muted)}
.composer{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:8px}
.composer textarea{min-height:46px;max-height:140px}
.coach-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font:700 1.2rem var(--display);flex:none}
.mk{display:grid;grid-template-columns:auto 1fr 7.2em;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mk:last-child{border-bottom:none}
.mk input[type=checkbox]{width:22px;height:22px;accent-color:var(--good);margin:0}
.mk .n{min-width:0;overflow-wrap:anywhere}
.mk .q{font-size:.8rem;color:var(--muted);display:block}
.mk.done .n{text-decoration:line-through;color:var(--muted)}
.mk input[type=number]{font-size:1rem;padding:6px 8px;text-align:right}
.mk-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:0;margin-left:6px}
.brand{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
header h1{font-size:1.7rem}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.w.wide{grid-column:1/-1}
.w .big{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.w .big small{font-size:.9rem;color:var(--muted);font-weight:600}
.w .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.w .acts .btn{padding:8px 10px;font-size:.85rem}
.w.hero{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.w.hero .q{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.15;text-wrap:balance}
.w.hero .label{color:inherit;opacity:.65}
.w.hero .link{color:inherit;opacity:.8;text-align:left}
.w.go{cursor:pointer}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars .b i.hit{background:var(--good)}
.bars .b span{font-size:.65rem;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.kv:last-child{border-bottom:none}
.kv b{font-family:var(--display);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand">Bitácora de Hierro</div><h1 id="page-title">Hoy</h1></div>
    <span class="status" id="status">Conectando…</span>
  </header>
  <main id="view"></main>
</div>
<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <div><span class="lab">Descanso</span><span class="t" id="t-left">0:00</span></div>
    <span class="sp"></span>
    <button data-s="90">1:30</button><button data-s="120">2:00</button><button data-s="180">3:00</button>
    <button id="t-stop">Parar</button>
  </div>
</div>
<nav id="tabs"><div class="in">
  <button data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Inicio</button>
  <button data-tab="entreno"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Entreno</button>
  <button data-tab="comida"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 21V3c2.2 0 4 2.5 4 6.5S18 14 16 14"/></svg>Comida</button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Progreso</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
  <button data-tab="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg>Coach</button>
</div></nav>

<script>
/* ---------- exercise library ---------- */
const LIB = {
 banca:["Press de banca","Pecho"], inclinado:["Press inclinado con mancuernas","Pecho"], banca_manc:["Press plano con mancuernas","Pecho"],
 inclinado_barra:["Press inclinado con barra","Pecho"], cruces:["Cruces en polea","Pecho"], aperturas:["Aperturas con mancuernas","Pecho"],
 pec_deck:["Pec deck","Pecho"], press_maquina:["Press de pecho en máquina","Pecho"], fondos:["Fondos","Pecho"],
 dominadas:["Dominadas","Espalda"], jalon:["Jalón al pecho","Espalda"], remo:["Remo con barra","Espalda"], remo_manc:["Remo con mancuerna","Espalda"],
 remo_polea:["Remo en polea sentado","Espalda"], remo_t:["Remo en T","Espalda"], remo_apoyado:["Remo con pecho apoyado","Espalda"], pullover:["Pullover en polea","Espalda"], peso_muerto:["Peso muerto","Espalda"],
 militar:["Press militar","Hombro"], hombro_manc:["Press de hombro con mancuernas","Hombro"], laterales:["Elevaciones laterales","Hombro"],

let docs = {}, coll = null, mode = null;
const dirty = new Set(), timers = {}, inflight = {}, pending = {};
function setStatus(t,err){const s=$("#status");s.textContent=t;s.className="status"+(err?" err":"")}
function lsLoad(){try{return JSON.parse(localStorage.getItem("bitacora")||"{}")}catch(e){return {}}}
function lsSave(){try{localStorage.setItem("bitacora",JSON.stringify(docs))}catch(e){}}
async function waitClaude(){return null;for(let i=0;i<20 && !(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));return window.claude&&window.claude.use?window.claude:null}
async function initStore(){
  const c=await waitClaude();
  if(c){
    try{
      const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
      const uid=user?await user.id():null;
      if(db&&uid){
        mode="db"; coll=db.collection("data/users/"+uid);
        [...dirty].forEach(id=>flush(id));
        const t=setTimeout(()=>setStatus("Sin conexión, reintentando…",true),10000);
        coll.onSnapshot(snap=>{
          if(!snap.metadata.fromCache){clearTimeout(t);setStatus("Guardado en tu cuenta")}
          const next={};
          snap.docs.forEach(d=>{next[d.id]=dirty.has(d.id)?docs[d.id]:clone(d.data())});
          dirty.forEach(id=>{if(docs[id]&&!next[id])next[id]=docs[id]});
          docs=next; softRender();
        },e=>{clearTimeout(t);setStatus("No se pudo leer tus datos ("+e.code+")",true)});
        return;
      }
    }catch(e){}
  }
  mode="local"; const early={};dirty.forEach(id=>early[id]=docs[id]);dirty.clear();docs=Object.assign(lsLoad(),early);lsSave();
  setStatus("Guardado en este dispositivo"); render();
}
function save(id){
  if(!mode){dirty.add(id);return}
  if(mode==="local"){lsSave();return}
  dirty.add(id); clearTimeout(timers[id]); timers[id]=setTimeout(()=>flush(id),600);
}
async function flush(id){
  if(inflight[id]){pending[id]=true;return}
  inflight[id]=true;
  try{ if(docs[id]) await coll.doc(id).set(clone(docs[id])); else await coll.doc(id).delete(); }
  catch(e){setStatus(e.code==="quota_exceeded"?"Almacenamiento lleno":"No se pudo guardar, revisa tu conexión",true)}
  inflight[id]=false;
  if(pending[id]){pending[id]=false;return flush(id)}
  dirty.delete(id);
}

async function gem(contents,{json,signal}={}){

  catch(e){ throw {code:e&&e.name==="AbortError"?"cancelled":"offline"} }
  if(!r.ok){ let msg=""; try{msg=(await r.json()).error.message||""}catch(e){}
    throw {code:r.status===429?"rate_limited":r.status===404?"bad_model":(r.status===400||r.status===401||r.status===403)&&/key|API_KEY|permission/i.test(msg)?"bad_key":"upstream_error",message:msg}; }

}

function streakWeeks(){
  const byWeek={};sessions().filter(trained).forEach(s=>{const w=weekStart(s.date);byWeek[w]=(byWeek[w]||0)+1});
  let w=weekStart(today()), n=0;
  if((byWeek[w]||0)>=4)n++;

/* progressive overload: double progression */
function suggest(id,repStr,sets,before){
  const [lo,hi]=rangeOf(repStr);
  const hist=sessions().filter(x=>x.date<before&&x.ex&&doneRows(x.ex[id]).length);
  if(!hist.length)return null;
  const rows=doneRows(hist[hist.length-1].ex[id]).map(r=>[+r[0],+r[1]]);
  const w=Math.max(...rows.map(r=>r[0]));
  const atW=rows.filter(r=>r[0]===w);
  const fmt=v=>String(Math.round(v*2)/2).replace(".",",");
  if(atW.length>=sets&&atW.every(r=>r[1]>=hi)){
    const nk=w+incFor(id);
    return {kg:nk,reps:Array(Math.max(sets,rows.length)).fill(lo),up:true,txt:`${fmt(nk)} kg × ${lo}+`,why:`Completaste ${sets}×${hi} con ${fmt(w)} kg: sube ${fmt(incFor(id))} kg.`};
  }
  const prev2=hist.length>1?doneRows(hist[hist.length-2].ex[id]).map(r=>[+r[0],+r[1]]):[];
  const missed=rs=>rs.filter(r=>r[0]===w&&r[1]<lo).length>=2;

  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","chart");svg.setAttribute("role","img");
  svg.setAttribute("aria-label",`Gráfica: de ${pts[0].y} a ${pts[pts.length-1].y} ${unit}`);

    add("line",{x1:L,x2:W-R,y1:y,y2:y,style:"stroke:var(--line);stroke-width:1"});
    add("text",{x:L-6,y:y+4,"text-anchor":"end",style:"fill:var(--muted);font:12px var(--display)"},(Math.round(v*10)/10).toString())}
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  if(pts.length>1)add("path",{d:d+` L${X(pts.length-1)} ${H-B} L${X(0)} ${H-B} Z`,style:"fill:var(--accent-soft);stroke:none"});
  add("path",{d,style:"fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round"});
  pts.forEach((p,i)=>add("circle",{cx:X(i),cy:Y(p.y),r:i===pts.length-1?4.5:2.5,style:"fill:var(--accent)"}));
  add("text",{x:X(0),y:H-6,"text-anchor":pts.length===1?"middle":"start",style:"fill:var(--muted);font:12px var(--body)"},fmtD(pts[0].x));
  if(pts.length>1)add("text",{x:W-R,y:H-6,"text-anchor":"end",style:"fill:var(--muted);font:12px var(--body)"},fmtD(pts[pts.length-1].x));
  return svg;

  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

function jointsOf(p){

  return {ankle,knee,hip,neck,head,elbow,hand,toe};
}

  s+=ln(J.hip,J.neck,H.torso?A:F,H.torso?8:5)+ci(J.head,8,F,"var(--surface)");
  s+=ln(J.neck,J.elbow,H.ua?A:F,H.ua?6:4)+ln(J.elbow,J.hand,F,3.5);
  if(H.sh)s+=ci(J.neck,5,A,A);

function drawFront(id,D,k){
  const p=lerp(D.a,D.b,k), A="var(--accent)", F="var(--fg)", M="var(--muted)";

  if(D.seat)s+=`<line x1="58" y1="${hipY+6}" x2="102" y2="${hipY+6}" style="stroke:${M};stroke-width:6;stroke-linecap:round"/>`;
  s+=ln([cx,hipY],[cx,nY],F,5)+ci([cx,nY-11],8,F,"var(--surface)");
  const shL=[cx-14,nY+2],shR=[cx+14,nY+2];
  for(const sg of [-1,1]){

    s+=ln([cx,nY+2],sh,F,4)+ln(sh,el,F,4)+ln(el,hd,F,3.5);

}
